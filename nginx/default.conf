# Nginx config for Cloud Run static hosting
# - HashRouter なので SPA fallback は原則不要、ただし保険で try_files
# - /notice/feed.xml と /notice/incidents.json の Content-Type 明示
# - 静的アセット (js/css/img/woff) は 7 日キャッシュ
# - /healthz でヘルスチェック
# 設計: 社内運用設計に基づく Nginx 構成

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HashRouter の保険 + 深いパス直アクセスを index にフォールバック
  location / {
    try_files $uri $uri/ /index.html;
  }

  # prebuild 生成物の Content-Type 明示
  location = /notice/feed.xml {
    default_type application/rss+xml;
  }
  location = /notice/incidents.json {
    default_type application/json;
  }

  # 静的アセットキャッシュ (immutable build artifact)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # ヘルスチェック
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
